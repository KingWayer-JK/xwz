<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小王子</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0f0f0f;
      color: #fff;
      padding: 24px;
    }
    .wrap { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 20px; margin-bottom: 14px; }

    .player-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
    }
    .player-box iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <div class="wrap">
    <h1>小王子</h1>
    <div class="player-box">
      <iframe
        src="//player.bilibili.com/player.html?bvid=BV1WCWx6GEAT&page=1&high_quality=1&autoplay=0"
        allowfullscreen
        scrolling="no">
      </iframe>
    </div>
  </div>

</body>
</html>
